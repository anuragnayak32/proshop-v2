apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: demo-db

spec:
  serviceName: demo-db-headless

  replicas: 3

  selector:
    matchLabels:
      app: demo-db

  template:
    metadata:
      labels:
        app: demo-db

    spec:
      containers:
        - name: nginx
          image: nginx:latest

          volumeMounts:
            - name: demo-storage
              mountPath: /usr/share/nginx/html

  volumeClaimTemplates:
    - metadata:
        name: demo-storage

      spec: 
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi                          