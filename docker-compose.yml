#version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: proshop-backend
    ports:
      - "5000:5000"
    env_file:
      - .env


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: proshope-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend  
  
  mongodb:
    image: mongo:7
    container_name: proshoo-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db  

volumes:
  mongodb_data: