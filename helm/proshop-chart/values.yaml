# Default values for proshop-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
# replicaCount: 3

#For backend image and replica
backend:
  replicaCount: 3

  image:
    repository: proshop-v2-backend
    tag: v3
    pullPolicy: Never

  containerPort: 5000

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"

    limits:
      memory: "512Mi"
      cpu: "500m"  

  service:
    type: ClusterIP
    port: 5000 

  config:
    #mongoUri: mongodb://proshop-dev-proshop-chart-mongodb-headless:27017/proshop
    nodeEnv: development
    port: "5000"
    paypalClientId: test
    paypalAppSecret: test
    paypalApiUrl: https://api-m.sandbox.paypal.com  

  livenessProbe:
    httpGet:
      path: /health
      port: 5000

    initialDelaySeconds: 10
    periodSeconds: 5

  readinessProbe:
    httpGet:
      path: /health
      port: 5000

    initialDelaySeconds: 5
    periodSeconds: 5

  secret:
    jwtSecret: 8b7f9d3a1c5e8f4b7d2a9e6c3f1b8d5e4a7c9f2d6e1b3a8f5c7d9e2a4b6f8c1d3e5a7b9c2d4f6e8a1b3c5d7f9e2a4c6  


       


frontend:

  replicaCount: 1

  image:
    repository: proshop-v2-frontend
    tag: latest
    pullPolicy: Never

  service:
    type: NodePort
    port: 3000

  containerPort: 3000  


