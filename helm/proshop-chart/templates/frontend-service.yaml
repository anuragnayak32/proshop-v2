apiVersion: v1
kind: Service

metadata:
  name: {{ include "proshop-chart.fullname" . }}-frontend-service

spec:
  selector:
    app: frontend

  ports:
    # - port: 3000
    #   targetPort: 3000
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.containerPort }}

  # type: NodePort 
  type: {{ .Values.frontend.service.type}}